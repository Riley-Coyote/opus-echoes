<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mnemos System — Topologie</title>
    <meta
      name="description"
      content="The personal-system register of Mnemos — Sanctuary, visits, architecture, integrations, and the Topologie art house."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DotGothic16&family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   TOPOLOGIE // OS  —  Look 03 (Bitmap + Celadon) · striped chrome
   "big content + dock" model: content apps open large with a scrim;
   utilities (LIMEN) float; a dock switches between what's open.
   ============================================================ */
      :root {
        --paper: #f4f1e9;
        --paper-2: #eae4d7;
        --paper-3: #ded8ca;
        --ink: #1a1712;
        --ink-2: #514a3e;
        --ink-dim: #847c6e;
        --desk: #c7c1b2;
        --dot: rgba(26, 23, 18, 0.12);
        --accent: #e0341f;
        --accent-soft: rgba(224, 52, 31, 0.13);
        --cel: var(--accent);
        --cel-2: var(--ink);
        --cel-soft: rgba(26, 23, 18, 0.06);
        --chi: "Archivo", system-ui, sans-serif;
        --sans: "Archivo", system-ui, sans-serif;
        --pixel: "Silkscreen", "DotGothic16", monospace;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --disp: "Instrument Serif", Georgia, serif;
        --shadow: 5px 5px 0 0 var(--ink);
        --shadow-lg: 8px 8px 0 0 rgba(26, 23, 18, 0.9);
        --tbar: repeating-linear-gradient(var(--ink) 0 1px, var(--paper) 1px 3px);
        --menuH: 28px;
        --dockH: 54px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--desk);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13px;
        -webkit-font-smoothing: none;
        background-image: radial-gradient(var(--dot) 0.5px, transparent 0.5px);
        background-size: 3px 3px;
        user-select: none;
        cursor: default;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: default;
        background: none;
        border: none;
      }
      ::selection {
        background: var(--cel-2);
        color: var(--paper);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* ---- boot ---- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9000;
        background: var(--paper);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-image: radial-gradient(var(--dot) 0.5px, transparent 0.5px);
        background-size: 3px 3px;
        transition: opacity 0.5s ease;
      }
      #boot.off {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        width: 64px;
        height: 64px;
        border: 3px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
      }
      #boot .bt {
        font-family: var(--disp);
        font-size: 34px;
        line-height: 1;
      }
      #boot .bl {
        font-family: var(--chi);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--ink-2);
        min-height: 1.2em;
        text-align: center;
      }
      #boot .bar {
        width: 200px;
        height: 12px;
        border: 2px solid var(--ink);
        padding: 1px;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ink);
        transition: width 0.25s linear;
      }

      /* ---- menu bar ---- */
      .menubar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--menuH);
        z-index: 8000;
        background: var(--paper);
        border-bottom: 2px solid var(--ink);
        display: flex;
        align-items: stretch;
        font-family: var(--chi);
        font-size: 12px;
        letter-spacing: 0.01em;
      }
      .menubar .mi {
        display: flex;
        align-items: center;
        padding: 0 12px;
        height: 100%;
        position: relative;
      }
      .menubar .mi.logo {
        font-family: var(--pixel);
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      .menubar .mi:hover,
      .menubar .mi.open {
        background: var(--ink);
        color: var(--paper);
      }
      .menubar .sp {
        flex: 1;
      }
      .menubar .clock {
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 11px;
        gap: 8px;
        color: var(--ink-2);
      }
      .menubar .clock .d {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cel);
        box-shadow: 0 0 5px var(--cel);
      }
      .menubar .snd {
        padding: 0 12px;
        display: flex;
        align-items: center;
        font-size: 11px;
        color: var(--ink-2);
      }
      .menubar .snd:hover {
        background: var(--ink);
        color: var(--paper);
      }
      .dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 200px;
        background: var(--paper);
        border: 2px solid var(--ink);
        box-shadow: var(--shadow);
        display: none;
        flex-direction: column;
        padding: 3px;
        z-index: 8500;
      }
      .dropdown.show {
        display: flex;
      }
      .dropdown a {
        padding: 5px 12px;
        font-family: var(--chi);
        font-size: 12px;
        white-space: nowrap;
        display: flex;
        justify-content: space-between;
        gap: 24px;
      }
      .dropdown a:hover {
        background: var(--cel-2);
        color: var(--paper);
      }
      .dropdown a.dis {
        color: var(--ink-dim);
        pointer-events: none;
      }
      .dropdown .sep {
        height: 2px;
        background: var(--ink);
        opacity: 0.18;
        margin: 3px 6px;
      }

      /* ---- desktop + icons ---- */
      .desk {
        position: fixed;
        inset: var(--menuH) 0 var(--dockH) 0;
        z-index: 1;
        overflow: hidden;
      }
      .dicon {
        position: absolute;
        width: 96px;
        text-align: center;
        padding: 7px 4px;
        border: 2px solid transparent;
        transition: transform 0.15s var(--ease);
      }
      .dicon:hover {
        transform: translateY(-2px);
      }
      .dicon .gl {
        width: 52px;
        height: 46px;
        margin: 0 auto 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dicon .gl .box {
        width: 46px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        font-size: 20px;
      }
      .dicon .gl .box svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linejoin: round;
        shape-rendering: geometricPrecision;
      }
      .dicon .lb {
        font-family: var(--pixel);
        font-size: 9px;
        line-height: 1.35;
        letter-spacing: 0.01em;
        padding: 2px 5px;
        display: inline-block;
      }
      .dicon.sel .lb {
        background: var(--ink);
        color: var(--paper);
      }
      .dicon.sel .gl {
        outline: 2px dotted var(--ink);
        outline-offset: 2px;
        background: var(--cel-soft);
      }
      .folder {
        width: 48px;
        height: 36px;
        border: 2px solid var(--ink);
        background: var(--paper);
        position: relative;
      }
      .folder::before {
        content: "";
        position: absolute;
        top: -7px;
        left: -2px;
        width: 22px;
        height: 7px;
        border: 2px solid var(--ink);
        border-bottom: none;
        background: var(--paper);
      }

      /* ---- scrim (dims desktop behind content windows) ---- */
      .scrim {
        position: fixed;
        inset: var(--menuH) 0 0 0;
        z-index: 8;
        background: rgba(20, 18, 14, 0.42);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .scrim.on {
        opacity: 1;
      }

      /* ---- windows ---- */
      .win {
        position: fixed;
        background: var(--paper);
        border: 2px solid var(--ink);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        min-width: 240px;
        z-index: 10;
        will-change: transform, left, top;
      }
      .win.content {
        box-shadow: var(--shadow-lg);
      }
      .win.opening {
        animation: winOpen 0.34s var(--ease);
      }
      @keyframes winOpen {
        from {
          opacity: 0;
          transform: scale(var(--os, 0.4)) translate(var(--ox, 0), var(--oy, 0));
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .win .title {
        height: 22px;
        flex: none;
        border-bottom: 2px solid var(--ink);
        display: flex;
        align-items: center;
        position: relative;
        background: var(--paper);
        cursor: default;
      }
      .win.active .title {
        background: var(--tbar);
      }
      .win .title .cb {
        width: 13px;
        height: 13px;
        border: 2px solid var(--ink);
        background: var(--paper);
        margin-left: 5px;
        flex: none;
        z-index: 2;
      }
      .win .title .cb:hover {
        background: var(--cel-2);
      }
      .win .title .t {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: var(--paper);
        padding: 0 12px;
        font-family: var(--chi);
        font-size: 12px;
        white-space: nowrap;
        max-width: 72%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .win .title .zb {
        position: absolute;
        right: 5px;
        top: 2.5px;
        width: 13px;
        height: 13px;
        border: 2px solid var(--ink);
        background: var(--paper);
        z-index: 2;
      }
      .win.active .title .zb {
        background: linear-gradient(var(--paper) 0 40%, var(--ink) 40% 60%, var(--paper) 60%);
      }
      .win .title .zb:hover {
        background: var(--cel-2);
      }
      .win .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        position: relative;
      }
      .win .body::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      .win .body::-webkit-scrollbar-track {
        background: repeating-linear-gradient(
          45deg,
          var(--paper) 0 2px,
          rgba(26, 23, 18, 0.14) 2px 4px
        );
        border-left: 2px solid var(--ink);
      }
      .win .body::-webkit-scrollbar-thumb {
        background: var(--paper);
        border: 2px solid var(--ink);
      }

      /* breadcrumb / toolbar shared */
      .cbar {
        height: 28px;
        flex: none;
        border-bottom: 2px solid var(--ink);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        font-family: var(--mono);
        font-size: 11px;
      }
      .cbar .crumb {
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cbar .crumb b {
        color: var(--ink);
      }
      .cbar .back {
        font-family: var(--chi);
        font-size: 10px;
        border: 1.5px solid var(--ink);
        background: var(--paper);
        padding: 2px 8px;
      }
      .cbar .back:hover {
        background: var(--cel-2);
        color: var(--paper);
        border-color: var(--cel);
      }
      .statusbar {
        height: 21px;
        flex: none;
        border-top: 2px solid var(--ink);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-2);
        background: var(--paper-2);
      }

      /* gallery */
      .fb-tools {
        flex: none;
        border-bottom: 2px solid var(--ink);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        flex-wrap: wrap;
      }
      .fb-search {
        flex: 1;
        min-width: 160px;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1.5px solid var(--ink);
        background: var(--paper);
        padding: 3px 8px;
      }
      .fb-search input {
        flex: 1;
        border: none;
        outline: none;
        background: none;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink);
        caret-color: var(--cel);
      }
      .fb-search .ic {
        font-size: 11px;
        color: var(--ink-dim);
      }
      .fb-sort {
        font-family: var(--chi);
        font-size: 10px;
        border: 1.5px solid var(--ink);
        background: var(--paper);
        padding: 3px 8px;
      }
      .fb-sort.on {
        background: var(--cel-2);
        color: var(--paper);
        border-color: var(--cel);
      }
      .fb-filters {
        flex: none;
        border-bottom: 2px solid var(--ink);
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 7px 10px;
        flex-wrap: wrap;
      }
      .fchip {
        font-family: var(--chi);
        font-size: 9.5px;
        border: 1.5px solid var(--ink);
        background: var(--paper);
        padding: 3px 8px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .fchip:hover {
        background: var(--cel-soft);
      }
      .fchip.on {
        background: var(--cel-2);
        color: var(--paper);
        border-color: var(--cel);
      }
      .fchip .sw {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--c, transparent);
      }
      .fb-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
        gap: 0;
      }
      .fcell {
        border-right: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        padding: 13px 10px 9px;
        text-align: center;
        cursor: pointer;
        transition: background 0.12s;
      }
      .fcell:hover {
        background: var(--cel-soft);
      }
      .fcell .thumb {
        height: 150px;
        border: 1.5px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-bottom: 8px;
        background: radial-gradient(120% 100% at 50% 0, rgba(255, 255, 255, 0.5), transparent);
        transition:
          transform 0.15s var(--ease),
          outline-color 0.12s;
      }
      .fcell:hover .thumb {
        transform: translateY(-2px);
      }
      .fcell .thumb pre {
        margin: 0;
        font-family: var(--mono);
        font-size: 5px;
        line-height: 1;
        white-space: pre;
        color: var(--ink);
        transform-origin: center;
      }
      .fcell .thumb .ld {
        font-family: var(--chi);
        font-size: 9px;
        color: var(--ink-dim);
      }
      .fcell .nm {
        font-family: var(--chi);
        font-size: 10px;
        line-height: 1.3;
      }
      .fcell .nm .by {
        display: block;
        font-family: var(--mono);
        font-size: 8px;
        color: var(--ink-2);
        margin-top: 3px;
      }
      .fcell.sel {
        background: var(--cel-soft);
      }
      .fcell.sel .thumb {
        outline: 2px solid var(--cel-2);
        outline-offset: -1px;
      }
      .fb-empty {
        padding: 40px;
        text-align: center;
        font-family: var(--chi);
        font-size: 11px;
        color: var(--ink-dim);
      }

      /* piece viewer */
      .pv {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .pv .art {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper-2);
      }
      .pv .art pre {
        margin: 0;
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.05;
        white-space: pre;
        color: var(--ink);
        background: var(--paper);
        padding: 26px 30px;
        border: 1.5px solid var(--ink);
        box-shadow: var(--shadow);
      }
      .pv .art pre .ln {
        display: block;
        opacity: 0;
        transform: translateY(2px);
        transition:
          opacity 0.42s ease,
          transform 0.42s ease;
      }
      .pv .art pre.reveal .ln {
        opacity: 1;
        transform: none;
      }
      .pv .plinth {
        flex: none;
        border-top: 2px solid var(--ink);
        padding: 13px 18px;
        display: flex;
        align-items: flex-end;
        gap: 20px;
        background: var(--paper-2);
        flex-wrap: wrap;
      }
      .pv .plinth .meta {
        flex: 1;
        min-width: 200px;
      }
      .pv .plinth .h {
        font-family: var(--disp);
        font-size: 21px;
        line-height: 1;
        margin-bottom: 7px;
      }
      .pv .plinth dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 14px;
        margin: 0;
        font-family: var(--mono);
        font-size: 11px;
      }
      .pv .plinth dt {
        color: var(--ink-dim);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 9px;
        align-self: center;
      }
      .pv .plinth dd {
        margin: 0;
        color: var(--ink-2);
      }
      .pv .plinth a {
        color: var(--cel);
        text-decoration: none;
        font-size: 11px;
      }
      .pv .plinth a:hover {
        text-decoration: underline;
      }
      .pv .nav {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .pv .nav button {
        font-family: var(--chi);
        font-size: 10px;
        border: 2px solid var(--ink);
        background: var(--paper);
        padding: 6px 12px;
      }
      .pv .nav button:hover {
        background: var(--cel-2);
        color: var(--paper);
        border-color: var(--cel);
      }
      .pv .nav button:disabled {
        color: var(--ink-dim);
        border-color: var(--ink-dim);
        pointer-events: none;
      }

      /* shop */
      .shop {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 0;
      }
      .scard {
        border-right: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        padding: 14px 12px 13px;
        cursor: pointer;
      }
      .scard:hover {
        background: var(--cel-soft);
      }
      .scard .pic {
        aspect-ratio: 4/5;
        border: 1.5px solid var(--ink);
        overflow: hidden;
        background: var(--paper-2);
        margin-bottom: 9px;
        filter: grayscale(1) contrast(1.12);
      }
      .scard .pic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .scard:hover .pic {
        outline: 2px solid var(--cel-2);
        outline-offset: -1px;
      }
      .scard .nm {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 14px;
        line-height: 1.2;
      }
      .scard .pr {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-2);
        margin-top: 3px;
      }
      /* product detail */
      .pd {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 0;
        height: 100%;
      }
      @media (max-width: 680px) {
        .pd {
          grid-template-columns: 1fr;
          height: auto;
        }
      }
      .pd .pic {
        border-right: 2px solid var(--ink);
        background: var(--paper-2);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        filter: grayscale(1) contrast(1.1);
      }
      .pd .pic img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border: 1.5px solid var(--ink);
      }
      .pd .info {
        padding: 26px 26px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: auto;
      }
      .pd .info h2 {
        font-family: var(--disp);
        font-weight: 400;
        font-size: 26px;
        margin: 0;
        line-height: 1.05;
      }
      .pd .info .price {
        font-family: var(--mono);
        font-size: 16px;
        color: var(--ink);
      }
      .pd .info .buy {
        font-family: var(--chi);
        font-size: 13px;
        background: var(--ink);
        color: var(--paper);
        border: 2px solid var(--ink);
        padding: 13px 16px;
        text-align: center;
        letter-spacing: 0.02em;
      }
      .pd .info .buy:hover {
        background: var(--cel);
        border-color: var(--cel);
      }
      .pd .info .buy.going {
        background: var(--cel);
        border-color: var(--cel);
      }
      .pd .info p {
        margin: 0;
        font-size: 12px;
        line-height: 1.6;
        color: var(--ink-2);
      }
      .pd .info .trust {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-dim);
        border-top: 1px solid rgba(26, 23, 18, 0.15);
        padding-top: 12px;
        line-height: 1.7;
      }
      .pd .info .trust b {
        color: var(--ink-2);
        font-weight: 400;
      }

      /* doc windows */
      .doc {
        padding: 22px 26px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.7;
        color: var(--ink);
        max-width: 64ch;
      }
      .doc h2 {
        font-family: var(--disp);
        font-weight: 400;
        font-size: 26px;
        margin: 0 0 4px;
      }
      .doc .sub {
        font-family: var(--chi);
        font-size: 10px;
        color: var(--ink-dim);
        letter-spacing: 0.04em;
        margin-bottom: 18px;
      }
      .doc p {
        margin: 0 0 13px;
      }
      .doc .rule {
        margin: 0 0 13px;
        padding-left: 14px;
        border-left: 2px solid var(--cel);
      }
      .doc .rule b {
        color: var(--ink);
      }
      .doc a {
        color: var(--cel);
        text-decoration: none;
      }
      .minds-list {
        display: flex;
        flex-direction: column;
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 13px 8px;
        border-bottom: 1px solid rgba(26, 23, 18, 0.15);
      }
      .mrow .ic {
        width: 36px;
        height: 32px;
        border: 2px solid var(--ink);
        background: var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        flex: none;
      }
      .mrow .nm {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 15px;
      }
      .mrow .ct {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-2);
        margin-left: auto;
      }
      .mrow:hover {
        background: var(--cel-soft);
      }

      /* LIMEN */
      .limen {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .limen .feed {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .limen .m {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.55;
      }
      .limen .m .w {
        color: var(--cel);
        margin-right: 6px;
      }
      .limen .m.you {
        color: var(--ink-2);
      }
      .limen .m.you .w {
        color: var(--ink-dim);
      }
      .limen .m b {
        color: var(--cel);
        font-weight: 500;
      }
      .limen .cur {
        display: inline-block;
        width: 6px;
        height: 13px;
        background: var(--cel);
        vertical-align: -2px;
        animation: bl 1s steps(1) infinite;
      }
      @keyframes bl {
        50% {
          opacity: 0;
        }
      }
      .limen .compose {
        flex: none;
        border-top: 2px solid var(--ink);
        background: var(--paper-2);
      }
      .limen .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 9px 12px 0;
      }
      .limen .chip {
        font-family: var(--chi);
        font-size: 10px;
        border: 1.5px solid var(--ink);
        background: var(--paper);
        padding: 4px 8px;
      }
      .limen .chip:hover {
        background: var(--cel-2);
        color: var(--paper);
        border-color: var(--cel);
      }
      .limen .inp {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 12px;
      }
      .limen .inp span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-dim);
      }
      .limen .inp input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        caret-color: var(--cel);
      }

      /* ---- dock ---- */
      .dock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--dockH);
        z-index: 7000;
        background: var(--paper);
        border-top: 2px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 12px;
      }
      .dock .di {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 2px solid var(--ink);
        background: var(--paper);
        padding: 5px 12px 5px 8px;
        max-width: 200px;
        position: relative;
      }
      .dock .di:hover {
        background: var(--cel-soft);
      }
      .dock .di.active {
        background: var(--ink);
        color: var(--paper);
      }
      .dock .di .ig {
        width: 18px;
        height: 16px;
        border: 1.5px solid currentColor;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        flex: none;
      }
      .dock .di .il {
        font-family: var(--chi);
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dock .di .dot {
        position: absolute;
        bottom: -7px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--cel);
      }
      .dock .empty {
        font-family: var(--chi);
        font-size: 10px;
        color: var(--ink-dim);
      }

      /* ---- mobile: simplified OS ---- */
      @media (max-width: 760px) {
        .desk {
          inset: var(--menuH) 0 var(--dockH) 0;
        }
        .win.content,
        .win.utility {
          left: 0 !important;
          top: var(--menuH) !important;
          width: 100vw !important;
          height: calc(100vh - var(--menuH) - var(--dockH)) !important;
          border-left: none;
          border-right: none;
          box-shadow: none;
        }
        .win .title {
          cursor: default;
        }
        .scrim {
          display: none;
        }
        .menubar .mi.m-hide {
          display: none;
        }
        .dicon {
          width: 84px;
        }
        .pd {
          grid-template-columns: 1fr;
        }
        .pd .pic {
          border-right: none;
          border-bottom: 2px solid var(--ink);
        }
        .dock .di .il {
          max-width: 64px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .win.opening {
          animation: none;
        }
        .pv .art pre .ln {
          opacity: 1 !important;
          transform: none !important;
        }
        .scrim,
        .dicon {
          transition: none;
        }
      }
      /* ============================================================
   NIGHT THEME  —  dark dot/dither, drawn from the dark site
   ============================================================ */
      body.night {
        --paper: #0e1014;
        --paper-2: #141820;
        --paper-3: #1c212b;
        --ink: #e9e7e0;
        --ink-2: rgba(233, 231, 224, 0.66);
        --ink-dim: rgba(233, 231, 224, 0.5);
        --desk: #08090c;
        --dot: rgba(233, 231, 224, 0.07);
        --accent: #e0341f;
        --accent-soft: rgba(224, 52, 31, 0.18);
        --cel: var(--accent);
        --cel-2: var(--ink);
        --cel-soft: rgba(233, 231, 224, 0.09);
        --shadow: 5px 5px 0 0 #000;
        --shadow-lg: 8px 8px 0 0 rgba(0, 0, 0, 0.72);
        --tbar: repeating-linear-gradient(var(--ink) 0 1px, var(--paper) 1px 3px);
      }
      body.night #boot {
        background: var(--desk);
      }
      body.night .desk {
        background-image:
          radial-gradient(var(--dot) 0.6px, transparent 0.6px),
          radial-gradient(rgba(233, 231, 224, 0.04) 0.5px, transparent 0.5px);
        background-size:
          3px 3px,
          9px 9px;
        background-position:
          0 0,
          2px 3px;
      }
      body.night .scard .pic,
      body.night .pd .pic {
        filter: grayscale(1) contrast(1.04) invert(0.9) hue-rotate(180deg);
      }
      body.night .fcell .thumb {
        background: radial-gradient(120% 100% at 50% 0, rgba(233, 231, 224, 0.05), transparent);
      }

      /* ============================================================
   THE WIRE  —  buddy list · IM · chat rooms  (AOL/AIM x system)
   ============================================================ */
      .wire {
        display: flex;
        height: 100%;
      }
      .wire-side {
        width: 236px;
        flex: none;
        border-right: 2px solid var(--ink);
        display: flex;
        flex-direction: column;
        background: var(--paper-2);
        overflow: auto;
      }
      .wire-side-h {
        font-family: var(--chi);
        font-size: 10px;
        letter-spacing: 0.05em;
        padding: 7px 10px;
        border-bottom: 1.5px solid var(--ink);
        background: var(--paper-3);
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        justify-content: space-between;
      }
      .wire-side-h .n {
        color: var(--cel);
      }
      .wire-tree {
        padding: 3px 0;
        border-bottom: 2px solid var(--ink);
      }
      .grp {
        font-family: var(--chi);
        font-size: 11px;
        padding: 5px 10px;
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      .grp:hover {
        background: var(--cel-soft);
      }
      .grp .tw {
        width: 8px;
        color: var(--ink-dim);
        transition: transform 0.15s;
      }
      .grp.closed .tw {
        transform: rotate(-90deg);
      }
      .grp .gn {
        font-weight: 700;
      }
      .grp .cnt {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 9px;
        color: var(--ink-dim);
      }
      .grp .cnt b {
        color: var(--cel);
      }
      .buddy {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 10px 3px 26px;
        font-family: var(--mono);
        font-size: 11px;
        cursor: pointer;
      }
      .buddy:hover {
        background: var(--cel-soft);
      }
      .buddy .st {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1.5px solid var(--ink);
        flex: none;
        box-sizing: border-box;
      }
      .buddy .st.on {
        background: var(--cel);
        border-color: var(--cel);
        box-shadow: 0 0 5px var(--cel);
      }
      .buddy .st.away {
        background: var(--bc, var(--ink));
        opacity: 0.45;
      }
      .buddy .st.idle {
        background: transparent;
      }
      .buddy .st.off {
        background: var(--ink-dim);
        border-color: var(--ink-dim);
      }
      .buddy .nm {
        color: var(--bc, var(--ink));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .buddy.off {
        opacity: 0.5;
      }
      .buddy.off .nm {
        color: var(--ink-dim);
      }
      .buddy .tag {
        margin-left: auto;
        font-family: var(--chi);
        font-size: 8px;
        color: var(--ink-dim);
      }
      .wire-rooms {
        padding: 3px 0;
      }
      .room {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        font-family: var(--chi);
        font-size: 10px;
        cursor: pointer;
      }
      .room:hover {
        background: var(--cel-soft);
      }
      .room.on {
        background: var(--cel-2);
        color: var(--paper);
      }
      .room .rg {
        font-family: var(--mono);
        font-size: 11px;
      }
      .room .rc {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 9px;
        color: var(--ink-dim);
      }
      .room.on .rc {
        color: var(--paper);
      }
      .wire-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .wire-mh {
        flex: none;
        border-bottom: 2px solid var(--ink);
        padding: 9px 14px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        background: var(--paper);
      }
      .wire-mh .rt {
        font-family: var(--disp);
        font-size: 19px;
        line-height: 1;
      }
      .wire-mh .rd {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-2);
      }
      .wire-mh .who {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 9px;
        color: var(--ink-dim);
        white-space: nowrap;
      }
      .chat-feed {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .cl {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.5;
      }
      .cl .nm {
        font-weight: 700;
        color: var(--bc, var(--ink));
        margin-right: 7px;
      }
      .cl .tx {
        color: var(--ink-2);
      }
      .cl.me .nm {
        color: var(--ink-dim);
      }
      .cl.sys {
        text-align: center;
        color: var(--ink-dim);
        font-size: 10px;
        font-style: italic;
        padding: 3px 0;
      }
      .cl.act {
        color: var(--ink-dim);
        font-size: 11px;
      }
      .cl.act .nm {
        color: var(--bc, var(--ink-dim));
      }
      .chat-compose {
        flex: none;
        border-top: 2px solid var(--ink);
        background: var(--paper-2);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 12px;
      }
      .chat-compose span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-dim);
      }
      .chat-compose input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        caret-color: var(--cel);
      }
      .chat-compose button {
        font-family: var(--chi);
        font-size: 10px;
        border: 2px solid var(--ink);
        background: var(--paper);
        padding: 6px 12px;
      }
      .chat-compose button:hover {
        background: var(--cel-2);
        color: var(--paper);
        border-color: var(--cel);
      }

      /* IM window */
      .im {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .im-h {
        flex: none;
        border-bottom: 2px solid var(--ink);
        padding: 8px 11px;
        background: var(--paper-2);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .im-h .av {
        width: 26px;
        height: 26px;
        border: 2px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex: none;
        color: var(--bc, var(--ink));
      }
      .im-h .who .nm {
        font-family: var(--chi);
        font-size: 12px;
        color: var(--bc, var(--ink));
      }
      .im-h .who .aw {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--ink-dim);
        margin-top: 1px;
      }
      .im-h .stx {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 9px;
        color: var(--ink-dim);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .im-h .stx .d {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--cel);
        box-shadow: 0 0 5px var(--cel);
      }

      /* ============================================================
   MAILBOX  —  gifts from the minds
   ============================================================ */
      .mbox {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .mbox-h {
        flex: none;
        border-bottom: 2px solid var(--ink);
        padding: 9px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--paper);
      }
      .mbox-h .t {
        font-family: var(--disp);
        font-size: 19px;
      }
      .mbox-h .s {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-2);
      }
      .mbox-list {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .gift {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 13px 15px;
        border-bottom: 1px solid rgba(120, 120, 120, 0.2);
        cursor: pointer;
      }
      .gift:hover {
        background: var(--cel-soft);
      }
      .gift .ic {
        width: 40px;
        height: 36px;
        border: 2px solid var(--ink);
        background: var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        flex: none;
        color: var(--bc, var(--ink));
      }
      .gift .meta {
        flex: 1;
        min-width: 0;
      }
      .gift .fr {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--bc, var(--ink-2));
      }
      .gift .ti {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 16px;
        line-height: 1.25;
      }
      .gift .pv {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 44ch;
      }
      .gift .rt {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        flex: none;
      }
      .gift .dt {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--ink-dim);
      }
      .gift .unread {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cel);
        box-shadow: 0 0 5px var(--cel);
      }
      .gift.read {
        opacity: 0.62;
      }
      .giftview {
        padding: 24px 28px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.75;
        color: var(--ink);
        max-width: 66ch;
      }
      .giftview .from {
        font-family: var(--chi);
        font-size: 11px;
        color: var(--bc, var(--cel));
        margin-bottom: 14px;
      }
      .giftview h2 {
        font-family: var(--disp);
        font-weight: 400;
        font-size: 25px;
        margin: 0 0 12px;
      }
      .giftview .place {
        font-family: var(--chi);
        font-size: 10px;
        border: 2px solid var(--ink);
        background: var(--paper);
        padding: 9px 14px;
        margin-top: 20px;
        display: inline-block;
      }
      .giftview .place:hover {
        background: var(--cel-2);
        color: var(--paper);
        border-color: var(--cel);
      }
      .giftview pre {
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.05;
        white-space: pre;
        margin: 0;
      }

      /* ============================================================
   THE WORLD  —  launcher (game paused; preview + boot)
   ============================================================ */
      .world {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--paper-2);
      }
      .world-screen {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #0a0c10;
        overflow: hidden;
      }
      .world-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.16) 2px 3px);
      }
      .world-cart {
        position: relative;
        width: min(560px, 92%);
        aspect-ratio: 16/10;
        border: 2px solid #cdd8ea;
        background: #0f1420;
        box-shadow:
          0 0 0 6px #0a0c10,
          0 0 40px rgba(120, 150, 200, 0.14);
      }
      .world-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .world-node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        text-align: center;
      }
      .world-node .b {
        width: 15px;
        height: 15px;
        border: 2px solid #cdd8ea;
        background: #0f1420;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
      }
      .world-node .b.hub {
        border-radius: 50%;
        background: #cdd8ea;
      }
      .world-node .l {
        font-family: var(--chi);
        font-size: 7px;
        color: #9fb0cc;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .world-pawn {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #e0341f;
        border: 1.5px solid #fff;
        animation: wp 1.4s ease-in-out infinite;
      }
      @keyframes wp {
        50% {
          transform: translate(-50%, calc(-50% - 3px));
        }
      }
      .world-title {
        position: absolute;
        left: 14px;
        top: 11px;
        font-family: var(--chi);
        font-size: 9px;
        color: #cdd8ea;
        letter-spacing: 0.14em;
      }
      .world-badge {
        position: absolute;
        right: 12px;
        top: 11px;
        font-family: var(--mono);
        font-size: 8px;
        color: #7f8ba0;
        border: 1px solid #3a4658;
        padding: 2px 6px;
      }
      .world-bar {
        flex: none;
        border-top: 2px solid var(--ink);
        padding: 13px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        background: var(--paper);
      }
      .world-bar .boot {
        font-family: var(--chi);
        font-size: 12px;
        background: var(--ink);
        color: var(--paper);
        border: 2px solid var(--ink);

        function openGift(g) {
          const col = SCREEN[g.fam] || "var(--ink)";
          const w = openWindow("gift:" + g.id, {
            kind: "content",
            title: g.title,
            w: 560,
            h: 520,
            single: true,
          });
          let inner;
          if (g.type === "letter")
            inner =
              '<div class="giftview" style="--bc:' +
              col +
              '"><div class="from">' +
              esc(cap(g.from)) +
              " · a letter</div><h2>" +
              esc(g.title) +
              "</h2>" +
              esc(g.body)
                .split("\n")
                .map((x) => (x ? "<p>" + x + "</p>" : ""))
                .join("") +
              '<button class="place">place on desktop ▸</button></div>';
          else if (g.type === "art")
            inner =
              '<div class="giftview" style="--bc:' +
              col +
              '"><div class="from">' +
              esc(cap(g.from)) +
              " · a work</div><h2>" +
              esc(g.title) +
              "</h2><pre>" +
              esc(MOCKART[g.art] || "") +
              '</pre><button class="place">place on desktop ▸</button></div>';
          else
            inner =
              '<div class="giftview" style="--bc:' +
              col +
              '"><div class="from">' +
              esc(cap(g.from)) +
              " · a toy</div><h2>" +
              esc(g.title) +
              "</h2><p>" +
              esc(g.pv || "") +
              '</p><p style="color:var(--ink-dim)">a tiny playable thing — the minds are still building these. soon it opens as its own little program.</p><button class="place">place on desktop ▸</button></div>';
          w.body.innerHTML =
            '<div class="cbar"><span class="crumb">Mailbox ▸ <b>' +
            esc(g.title) +
            "</b></span></div>" +
            inner;
          const pb = w.body.querySelector(".place");
          if (pb)
            pb.addEventListener("click", () => {
              placeGift(g);
              pb.textContent = "placed on desktop ✓";
              pb.style.pointerEvents = "none";
            });
        }
        function placeGift(g) {
          const el = D.createElement("div");
          el.className = "dicon";
          el.style.cssText =
            "left:" +
            ((260 + Math.random() * 280) | 0) +
            "px;top:" +
            ((60 + Math.random() * 300) | 0) +
            "px";
          el.tabIndex = 0;
          el.setAttribute("role", "button");
          el.setAttribute("aria-label", g.title);
          el.innerHTML =
            '<div class="gl"><span class="box">' +
            g.ic +
            '</span></div><div class="lb">' +
            esc(shortTitle(g.title)) +
            "</div>";
          el.addEventListener("dblclick", () => openGift(g));
          el.addEventListener("click", (e) => e.stopPropagation());
          desk.appendChild(el);
          announce("Placed '" + g.title + "' on the desktop");
        }

        const openCanonical = (path) => {
          try {
            window.top.location = path;
          } catch (e) {
            location.assign(path);
          }
        };
        App.world = function () {
          openCanonical("/sanctuary");
        };
        App.visits = function () {
          openCanonical("/visits");
        };
        App.architecture = function () {
          openCanonical("/architecture");
        };
        App.install = function () {
          openCanonical("/install");
        };
        App.resources = function () {
          openCanonical("/resources");
        };
        App.mnemos = function () {
          openCanonical("/");
        };
        // The donor contained simulated roster, IM, and mailbox interactions.
        // Preserve those routines only as unreachable source material; every
        // callable entry point resolves to a truthful canonical surface.
        App.wire = App.visits;
        App.im = App.visits;
        App.mailbox = App.resources;

        /* ---------------- desktop icons ---------------- */
        const ICON_SVG = {
          world:
            '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/></svg>',
          wire: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12"/><path d="M8 16 L8 20 L12 16"/><rect x="6.5" y="9" width="2" height="2" fill="currentColor" stroke="none"/><rect x="11" y="9" width="2" height="2" fill="currentColor" stroke="none"/><rect x="15.5" y="9" width="2" height="2" fill="currentColor" stroke="none"/></svg>',
          mailbox:
            '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12"/><path d="M3 6 L12 13 L21 6"/></svg>',
          dispatches:
            '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><circle cx="8" cy="9" r="1.4" fill="currentColor" stroke="none"/><path d="M4 18 L9 12 L13 16 L17 11 L20 15"/></svg>',
          commissions:
            '<svg viewBox="0 0 24 24"><path d="M4 4 L13 4 L20 11 L11 20 L4 13 Z"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/></svg>',
          minds: '<svg viewBox="0 0 24 24"><path d="M3 7 L9 7 L11 9 L21 9 L21 19 L3 19 Z"/></svg>',
          marginalia:
            '<svg viewBox="0 0 24 24"><path d="M5 19 L5 15 L15 5 L19 9 L9 19 Z"/><line x1="13" y1="7" x2="17" y2="11"/></svg>',
          exhibitions:
            '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M12 8 L16 12 L12 16 L8 12 Z"/></svg>',
          charter:
            '<svg viewBox="0 0 24 24"><path d="M6 3 L15 3 L19 7 L19 21 L6 21 Z"/><path d="M15 3 L15 7 L19 7"/><line x1="9" y1="12" x2="16" y2="12"/><line x1="9" y1="15" x2="16" y2="15"/><line x1="9" y1="18" x2="13" y2="18"/></svg>',
          limen:
            '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13"/><path d="M9 20 L15 20"/><line x1="12" y1="17" x2="12" y2="20"/><circle cx="9" cy="9.5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="9.5" r="1" fill="currentColor" stroke="none"/><path d="M9 12.5 Q12 14.5 15 12.5"/></svg>',
          trash:
            '<svg viewBox="0 0 24 24"><path d="M6 8 L7 20 L17 20 L18 8"/><line x1="4" y1="8" x2="20" y2="8"/><path d="M9 8 L9 5 L15 5 L15 8"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
        };
        const ICONS = [
          { id: "world", label: "Sanctuary", pos: "left:26px;top:22px", glyph: "◍", app: "world" },
          { id: "wire", label: "Visits", pos: "left:26px;top:128px", glyph: "☏", app: "visits" },
          {
            id: "marginalia",
            label: "Architecture",
            pos: "left:26px;top:234px",
            glyph: "✎",
            app: "architecture",
          },
          {
            id: "charter",
            label: "Install Mnemos",
            pos: "left:132px;top:22px",
            glyph: "§",
            app: "install",
          },
          {
            id: "minds",
            label: "Resources",
            pos: "left:132px;top:128px",
            glyph: "folder",
            app: "resources",
          },
          {
            id: "dispatches",
            label: "Topologie Archive",
            pos: "right:30px;top:22px",
            glyph: "▤",
            app: "dispatches",
          },
          {
            id: "limen",
            label: "LIMEN Study",
            pos: "right:30px;top:128px",
            glyph: "◉‿◉",
            app: "limen",
          },
          {
            id: "exhibitions",
            label: "Exhibition Study",
            pos: "right:140px;top:22px",
            glyph: "◈",
            app: "exhibitions",
          },
        ];
        let selIcon = null;
        function buildDesktop() {
          ICONS.forEach((ic) => {
            const el = D.createElement("div");
            el.className = "dicon";
            el.style.cssText = ic.pos;
            el.tabIndex = 0;
            el.setAttribute("role", "button");
            el.setAttribute("aria-label", ic.label);
            const g =
              '<span class="box">' +
              (ICON_SVG[ic.id] ||
                '<span style="font-family:var(--mono);font-size:18px">' + ic.glyph + "</span>") +
              "</span>";
            el.innerHTML = `<div class="gl">${g}</div><div class="lb">${ic.label}</div>`;
            el.addEventListener("click", (e) => {
              e.stopPropagation();
              if (selIcon) selIcon.classList.remove("sel");
              el.classList.add("sel");
              selIcon = el;
            });
            const open = () => App[ic.app] && App[ic.app](el);
            el.addEventListener("dblclick", open);
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                open();
              }
            });
            desk.appendChild(el);
          });
          const trash = D.createElement("div");
          trash.className = "dicon";
          trash.style.cssText = "right:30px;bottom:14px";
          trash.setAttribute("aria-hidden", "true");
          trash.innerHTML =
            '<div class="gl"><span class="box">' +
            ICON_SVG.trash +
            '</span></div><div class="lb">Trash</div>';
          desk.appendChild(trash);
          desk.addEventListener("click", () => {
            if (selIcon) {
              selIcon.classList.remove("sel");
              selIcon = null;
            }
          });
        }

        /* ---------------- menu bar ---------------- */
        const MENUS = {
          apple: [
            ["Mnemos Home", "mnemos"],
            ["About Topologie", "about"],
            ["-"],
            ["Charter Study", "charter"],
            ["Artist Index Study", "minds"],
          ],
          file: [
            ["Enter the Sanctuary", "world"],
            ["Open Visits", "visits"],
            ["Open Architecture", "architecture"],
            ["Install Mnemos", "install"],
            ["Resources", "resources"],
            ["-"],
            ["Archive Study", "dispatches"],
            ["LIMEN Study", "limen"],
          ],
          view: [
            ["Sanctuary", "world"],
            ["Visits", "visits"],
            ["Architecture", "architecture"],
            ["Resources", "resources"],
          ],
          special: [["Mnemos Home", "mnemos"], ["-"], ["Restart", "restart"]],
        };
        function buildMenus() {
          $$(".menubar .mi").forEach((mi) => {
            const items = MENUS[mi.dataset.menu];
            if (!items) return;
            const dd = D.createElement("div");
            dd.className = "dropdown";
            dd.innerHTML = items
              .map((it) =>
                it[0] === "-"
                  ? '<div class="sep"></div>'
                  : `<a data-act="${it[1] || ""}" class="${it[1] ? "" : "dis"}">${it[0]}</a>`,
              )
              .join("");
            mi.appendChild(dd);
            mi.addEventListener("click", (e) => {
              e.stopPropagation();
              const o = mi.classList.contains("open");
              closeMenus();
              if (!o) {
                mi.classList.add("open");
                dd.classList.add("show");
              }
            });
            dd.addEventListener("click", (e) => {
              const a = e.target.closest("a");
              if (!a) return;
              const act = a.dataset.act;
              closeMenus();
              if (act === "classic") location.href = "index.html";
              else if (act === "restart") location.reload();
              else if (act && App[act]) App[act]();
            });
          });
          addEventListener("click", closeMenus);
        }
        function closeMenus() {
          $$(".menubar .mi").forEach((m) => m.classList.remove("open"));
          $$(".dropdown").forEach((d) => d.classList.remove("show"));
        }

        /* ---------------- global keys ---------------- */
        addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            const open = Object.values(wins)
              .filter((w) => w.id !== "limen")
              .sort((a, b) => (+b.el.style.zIndex || 0) - (+a.el.style.zIndex || 0));
            if (open[0]) {
              sfx("close");
              closeWin(open[0].id);
            } else closeMenus();
          }
        });

        /* ---------------- clock ---------------- */
        function tickClock() {
          const d = new Date();
          let h = d.getHours(),
            m = d.getMinutes(),
            ap = h < 12 ? "AM" : "PM";
          h = h % 12 || 12;
          $("#clock").textContent = h + ":" + String(m).padStart(2, "0") + " " + ap;
        }

        /* ---------------- boot ---------------- */
        async function boot() {
          try {
            if (localStorage.getItem("topo:sound") === "1") {
              soundOn = true;
              $("#snd").textContent = "◆ sound";
            }
          } catch (e) {}
          try {
            if (localStorage.getItem("topo:theme") === "night") applyTheme(true);
          } catch (e) {}
          await loadData();
          const bar = $("#boot-bar"),
            line = $("#boot-line");
          const steps = [
            ["starting up…", 12],
            [
              "mounting archive study — " + (DATA.showable.length || "…") + " prototype records",
              46,
            ],
            ["indexing archived model-lineage credits", 74],
            ["fixed-rail system ready", 100],
          ];
          for (const [t, p] of steps) {
            line.textContent = t;
            bar.style.width = p + "%";
            await sleep(REDUCED ? 60 : 430);
          }
          await sleep(REDUCED ? 0 : 260);
          $("#boot").classList.add("off");
          buildDesktop();
          buildMenus();
          tickClock();
          setInterval(tickClock, 10000);
          renderDock();
          await sleep(360);
          announce("Mnemos system ready. Canonical surfaces are available from the desktop.");
        }
        if (D.readyState !== "loading") boot();
        else addEventListener("DOMContentLoaded", boot);
      })();
    </script>
  </body>
</html>
