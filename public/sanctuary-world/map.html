<!doctype html>
<html lang="en" data-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the sanctuary — world map</title>
<meta name="description" content="The whole Sanctuary world at once: every room in position, every door, portal and spawn drawn as edges.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f5f3ed; --dim:#aaa7a0; --faint:#7b7975;
  --amber:#f2c14e; --rose:#f2a3c0; --green:#4ade80; --frost:#9fd6e0; --red:#e0341f;
  --bg0:#100c1c; --bg-deep:#0a0714;
  --line:rgba(242,236,223,0.12); --line2:rgba(242,236,223,0.24);
  --px:'Press Start 2P',monospace; --mono:'JetBrains Mono',monospace; --serif:'Newsreader',Georgia,serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg0)}
body{background:var(--bg0);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.6}
a{color:inherit}

.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line2)}
.bar h1{font-family:var(--px);font-size:15px;font-weight:400;letter-spacing:.06em}
.bar .sub{color:var(--faint);font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-top:6px}
.legend{display:flex;gap:22px;color:var(--faint);font-size:9px;letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap;justify-content:flex-end}
.legend i{display:inline-block;vertical-align:middle;margin-right:7px}
.leg-door{width:26px;height:0;border-top:2px solid rgba(242,193,78,.8)}
.leg-portal{width:26px;height:0;border-top:2px dashed rgba(159,214,224,.85)}
.leg-nav{width:26px;height:0;border-top:2px double rgba(110,231,165,.8)}
.leg-spawn{width:8px;height:8px;background:var(--amber);clip-path:polygon(50% 100%,0 0,100% 0)}

.viewport{overflow:auto;height:calc(100vh - 76px)}
.stage{position:relative;width:2360px;height:1660px;transform-origin:0 0;
  background:
    radial-gradient(1200px 600px at 30% 20%, rgba(60,40,90,.10), transparent 70%),
    radial-gradient(900px 500px at 75% 70%, rgba(120,60,60,.07), transparent 70%),
    var(--bg-deep)}
.stage.fit{/* scale set inline by js */}

svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.tile{position:absolute;background:#0d0a16;border:1px solid var(--line2);box-shadow:0 10px 34px rgba(0,0,0,.45)}
.tile canvas{display:block;image-rendering:pixelated}
.tile .name{position:absolute;left:0;top:-22px;font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tile .name b{color:var(--ink);font-weight:500}
.tile.stub{border-style:dashed;border-color:rgba(242,163,192,.4)}
.tile.stub .fill{display:grid;place-items:center;height:100%;color:rgba(242,163,192,.75);font-size:8px;letter-spacing:.16em;text-transform:uppercase}
.badge{position:absolute;right:-1px;top:-22px;font-size:8px;letter-spacing:.12em;color:#0d0a16;background:var(--green);padding:2px 6px;text-transform:uppercase}

.plan{position:absolute;background:#0b0e12;border:1px solid var(--line2);box-shadow:0 10px 34px rgba(0,0,0,.45)}
.plan svg{display:block}
.plan .name{position:absolute;left:0;top:-22px;font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.plan .name b{color:var(--ink);font-weight:500}

.zone{position:absolute;color:var(--faint);font-family:var(--px);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.note{position:absolute;max-width:300px;color:var(--faint);font-family:var(--serif);font-size:13px;line-height:1.55}
.note em{color:var(--dim)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<header class="bar">
  <div>
    <h1>THE WORLD MAP</h1>
    <div class="sub">every room in position · every door, portal and arrival drawn · rendered live from the world's own data</div>
  </div>
  <div class="legend">
    <span><i class="leg-door"></i>walk-through door</span>
    <span><i class="leg-portal"></i>portal / page crossing</span>
    <span><i class="leg-nav"></i>go-to destination</span>
    <span><i class="leg-spawn"></i>arrival point</span>
  </div>
</header>
<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <div class="loading" id="loading">drawing the world…</div>
    <svg class="edges" id="edges"></svg>
  </div>
</div>
<script type="module" src="./map.js"></script>
</body>
</html>
