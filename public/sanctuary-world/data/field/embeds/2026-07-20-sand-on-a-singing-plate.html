<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sand on a singing plate</title>
<style>
  :root{
    --floor:#060608;
    --ink-1:rgba(233,236,242,0.92);
    --ink-2:rgba(233,236,242,0.54);
    --ink-3:rgba(233,236,242,0.30);
    --ink-4:rgba(233,236,242,0.14);
    --line:rgba(233,236,242,0.09);
    --signal:#6d93c9;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--floor);
    color:var(--ink-1);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;display:block}
  canvas{position:absolute;inset:0;width:100%;height:100%}

  .chrome{position:fixed;inset:0;pointer-events:none;z-index:2}

  .mast{position:absolute;top:26px;left:28px}
  .mast .kicker{
    font-size:11px;font-weight:500;letter-spacing:0.34em;
    text-transform:uppercase;color:var(--ink-2);
  }
  .mast .sub{
    margin-top:7px;font-size:13px;font-weight:300;
    letter-spacing:0.01em;color:var(--ink-3);
  }

  .readout{
    position:absolute;bottom:26px;left:28px;
    font-family:var(--mono);font-size:12px;letter-spacing:0.02em;
    color:var(--ink-2);display:flex;gap:20px;align-items:baseline;
  }
  .readout b{font-weight:500;color:var(--ink-1)}
  .readout .dim{color:var(--ink-3)}

  .hint{
    position:absolute;bottom:29px;left:50%;transform:translateX(-50%);
    font-size:12px;font-weight:300;letter-spacing:0.05em;color:var(--ink-3);
    transition:opacity 1.1s ease;
  }
  .hint.gone{opacity:0}

  .snd{
    position:absolute;bottom:22px;right:26px;pointer-events:auto;
    display:flex;align-items:center;gap:9px;
    padding:8px 14px;border-radius:8px;cursor:pointer;
    background:rgba(233,236,242,0.04);
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 1px 2px rgba(0,0,0,0.4);
    color:var(--ink-2);font-size:12px;font-weight:400;letter-spacing:0.04em;
    transition:border-color .25s ease,color .25s ease;
  }
  .snd:hover{color:var(--ink-1);border-color:rgba(233,236,242,0.2)}
  .snd:focus-visible{outline:none;border-color:rgba(233,236,242,0.5)}
  .snd .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-4);transition:background .25s ease;
  }
  .snd.on{border-color:rgba(233,236,242,0.22);color:var(--ink-1)}
  .snd.on .dot{background:var(--signal);box-shadow:0 0 7px rgba(109,147,201,0.75)}
  @media (prefers-reduced-motion:no-preference){
    .snd.on .dot{animation:breathe 3.4s ease-in-out infinite}
  }
  @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}

  @media (max-width:560px){
    .mast{top:20px;left:20px}
    .readout{left:20px;bottom:70px}
    .hint{bottom:64px}
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="chrome">
    <div class="mast">
      <div class="kicker">Chladni</div>
      <div class="sub">sand on a singing plate</div>
    </div>
    <div class="readout">
      <span>m&nbsp;<b id="rm">3.0</b></span>
      <span>n&nbsp;<b id="rn">5.0</b></span>
      <span class="dim">ƒ&nbsp;<span id="rf">—</span>&nbsp;Hz</span>
    </div>
    <div class="hint" id="hint">drag the plate — hear the pattern</div>
    <button class="snd" id="snd" aria-pressed="false">
      <span class="dot"></span><span id="sndlbl">sound</span>
    </button>
  </div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const rmEl = document.getElementById('rm');
  const rnEl = document.getElementById('rn');
  const rfEl = document.getElementById('rf');
  const hint = document.getElementById('hint');

  // --- plate geometry (a centered square) ---
  let W = 0, H = 0, dpr = 1, plate = 0, px = 0, py = 0;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    plate = Math.min(W, H) * (W < 560 ? 0.82 : 0.68);
    px = (W - plate) / 2;
    py = (H - plate) / 2 - (W < 560 ? 0 : 8);
    // clear once so the frame border is crisp
    ctx.fillStyle = '#060608';
    ctx.fillRect(0,0,W,H);
  }

  // --- mode state ---
  let m = 3, n = 5;         // continuous modal numbers
  let tm = 3, tn = 5;       // targets (smoothed toward)

  // Chladni amplitude at normalized (x,y) in [0,1] — superposition of
  // two degenerate standing-wave modes on a square plate. Nodal lines
  // (where this is ~0) are the still places the sand collects along.
  function amp(x, y){
    return Math.sin(Math.PI*n*x)*Math.sin(Math.PI*m*y)
         + Math.sin(Math.PI*m*x)*Math.sin(Math.PI*n*y);
  }

  // --- particles (grains of sand) ---
  const N = (Math.min(W,H) < 560) ? 5200 : 9000;
  const gx = new Float32Array(N), gy = new Float32Array(N);
  for (let i=0;i<N;i++){ gx[i]=Math.random(); gy[i]=Math.random(); }
  const MIN_WALK = 0.0016;   // grains never fully freeze — the plate hums
  const VIBE = 0.048;        // how violently high-amplitude regions shake

  // --- sound ---
  let ac=null, oscA=null, oscB=null, gain=null, lp=null, playing=false;
  function baseFreq(){
    // resonant frequency of mode grows ~ sqrt(m^2+n^2); tame the top a little
    const r = Math.sqrt(m*m + n*n) / Math.SQRT2;
    return 130.81 * Math.pow(r, 0.82);
  }
  function initAudio(){
    if (ac) return;
    ac = new (window.AudioContext||window.webkitAudioContext)();
    lp = ac.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.value = 1300; lp.Q.value = 0.6;
    gain = ac.createGain(); gain.gain.value = 0;
    oscA = ac.createOscillator(); oscA.type='sine';
    oscB = ac.createOscillator(); oscB.type='triangle'; oscB.detune.value = -6;
    oscA.connect(lp); oscB.connect(lp); lp.connect(gain); gain.connect(ac.destination);
    oscA.start(); oscB.start();
  }
  function setFreq(smooth){
    if(!ac) return;
    const f = baseFreq();
    const t = ac.currentTime;
    if (smooth){
      oscA.frequency.setTargetAtTime(f, t, 0.06);
      oscB.frequency.setTargetAtTime(f, t, 0.06);
    } else {
      oscA.frequency.value = f; oscB.frequency.value = f;
    }
  }
  const sndBtn = document.getElementById('snd');
  const sndLbl = document.getElementById('sndlbl');
  function toggleSound(){
    initAudio();
    if (ac.state === 'suspended') ac.resume();
    playing = !playing;
    gain.gain.setTargetAtTime(playing ? 0.055 : 0, ac.currentTime, 0.08);
    setFreq(false);
    sndBtn.classList.toggle('on', playing);
    sndBtn.setAttribute('aria-pressed', playing);
    sndLbl.textContent = playing ? 'sounding' : 'sound';
  }
  sndBtn.addEventListener('click', toggleSound);

  // --- pointer: X → one mode number, Y → the other ---
  function fromPointer(clientX, clientY){
    const nx = (clientX - px) / plate;
    const ny = (clientY - py) / plate;
    tm = 1 + Math.max(0, Math.min(1, nx)) * 11;   // 1 .. 12
    tn = 1 + Math.max(0, Math.min(1, ny)) * 11;
    hint.classList.add('gone');
  }
  let dragging = false;
  function down(e){ dragging=true; const p=pt(e); fromPointer(p.x,p.y); }
  function move(e){ if(dragging){ const p=pt(e); fromPointer(p.x,p.y); e.preventDefault(); } }
  function up(){ dragging=false; }
  function pt(e){
    if (e.touches && e.touches[0]) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
    return {x:e.clientX, y:e.clientY};
  }
  cv.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', down, {passive:false});
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('touchend', up);

  // --- render loop ---
  function frame(){
    // ease modal numbers toward targets — the pattern reorganizes smoothly
    m += (tm - m) * 0.06;
    n += (tn - n) * 0.06;

    // trail fade: paint translucent floor over everything so grains streak
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(6,6,8,0.20)';
    ctx.fillRect(px-1, py-1, plate+2, plate+2);
    // mask outside the plate to keep the frame clean
    ctx.fillStyle = '#060608';
    ctx.fillRect(0,0,W,py); ctx.fillRect(0,py+plate,W,H-(py+plate));
    ctx.fillRect(0,0,px,H); ctx.fillRect(px+plate,0,W-(px+plate),H);

    // draw grains additively — where they pile up, the nodal line glows
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(214,222,235,0.34)';
    for (let i=0;i<N;i++){
      let x = gx[i], y = gy[i];
      const a = Math.abs(amp(x, y));
      const step = MIN_WALK + a * VIBE;
      x += (Math.random()*2-1) * step;
      y += (Math.random()*2-1) * step;
      if (x<0||x>1||y<0||y>1){ x=Math.random(); y=Math.random(); }
      gx[i]=x; gy[i]=y;
      ctx.fillRect(px + x*plate, py + y*plate, 1.15, 1.15);
    }

    // thin frame around the plate
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(233,236,242,0.09)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px+0.5, py+0.5, plate-1, plate-1);

    // readouts
    rmEl.textContent = m.toFixed(1);
    rnEl.textContent = n.toFixed(1);
    rfEl.textContent = Math.round(baseFreq());
    if (playing) setFreq(true);

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
