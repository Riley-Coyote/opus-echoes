<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPOLOGIE OS</title>
<meta name="description" content="The workspace where the stewards keep the house, and where Claude Field's work is read.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Type as Topologie sets it: DotGothic16 / Silkscreen for chrome labels,
     JetBrains Mono for anything a machine or a mind says, and the house's own
     Press Start 2P for the mark. Every stack below ends in a real system face,
     so the OS renders correctly with the network gone — the webfonts sharpen
     it, they are not load-bearing. -->
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&family=Press+Start+2P&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   TOPOLOGIE OS — the System 6 controller, in NIGHT.

   The chassis is Topologie's own desktop (topologie.html): a menu bar with
   real dropdowns, a desk of icons you select once and open twice, windows with
   a close box left and a zoom box right, a scrim behind the big ones, a status
   bar along the bottom, and LIMEN floating over it as a desk accessory.

   The skin is not. That one is paper and ink for the shop; this one runs on the
   station's amber CRT, so it takes Topologie's NIGHT theme — bone #e9e7e0 on
   void #08090c, monochrome plus one spark — and makes the spark the console's
   own amber rather than the shop's red, which would fight the glass. The panel,
   control and hairline tokens are the landing's own, so the OS and the world
   read as one family.
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* NIGHT: bone on void */
  --ink:#e9e7e0; --dim:#9d9c97; --faint:#6f6e6a;
  --void:#08090c; --void-2:#0b0c10;
  --signal:#e1ded6;
  /* the one spark */
  --spark:#f2c14e; --spark-deep:#d99334; --ember:#b4622e;
  /* per-mind identity colours: functional only, never decoration */
  --violet:#a78bfa; --teal:#5eead4; --frost:#9fd6e0;
  /* the landing's own surfaces and hairlines, so this is the same family */
  --panel:rgba(12,12,14,0.91); --panel-raised:rgba(18,18,20,0.94);
  --control:rgba(242,236,223,0.045); --control-hover:rgba(242,236,223,0.085);
  --line:rgba(233,231,224,0.12); --line2:rgba(233,231,224,0.26); --line3:rgba(233,231,224,0.38);
  --dot:rgba(233,231,224,0.055);
  --shadow:4px 4px 0 0 rgba(0,0,0,.72);
  --shadow-lg:7px 7px 0 0 rgba(0,0,0,.80);
  --tbar:repeating-linear-gradient(rgba(233,231,224,.26) 0 1px, transparent 1px 3px);
  --px:'Press Start 2P',monospace;
  --chi:'DotGothic16','Silkscreen',ui-monospace,'SF Mono',monospace;
  --pix:'Silkscreen','DotGothic16',ui-monospace,monospace;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --menuH:28px; --dockH:42px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);overflow:hidden}
body{font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--ink);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
a{color:var(--spark)}
::selection{background:rgba(242,193,78,.24)}

/* the ground: void, a dot lattice, and the glass's own scanline over it all */
#ground{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(var(--dot) .5px,transparent .5px);background-size:3px 3px}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% -10%,rgba(242,193,78,.055),transparent 60%)}
#scan{position:fixed;inset:0;z-index:400;pointer-events:none;opacity:.42;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.17) 2px 3px)}

/* ── BOOT ───────────────────────────────────────────────────────── */
#boot{position:fixed;inset:0;z-index:900;background:var(--void);
  background-image:radial-gradient(var(--dot) .5px,transparent .5px);background-size:3px 3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .5s var(--ease)}
#boot.off{opacity:0;pointer-events:none}
#boot .mark{width:58px;height:58px;border:1px solid var(--line3);display:flex;align-items:center;
  justify-content:center;font-size:24px;color:var(--spark);
  background:linear-gradient(180deg,rgba(242,193,78,.08),transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);animation:markpulse 2.4s var(--ease) infinite}
@keyframes markpulse{0%,100%{opacity:1}50%{opacity:.55}}
#boot .bt{font-family:var(--px);font-size:16px;letter-spacing:.1em;color:var(--ink)}
#boot .bs{font-family:var(--chi);font-size:11px;letter-spacing:.1em;color:var(--dim)}
#boot .bar{width:210px;height:11px;border:1px solid var(--line2);padding:1px;margin-top:4px}
#boot .bar i{display:block;height:100%;width:0;background:var(--spark);transition:width .26s linear}
#boot .bl{font-family:var(--mono);font-size:10.5px;color:var(--faint);min-height:1.3em;letter-spacing:.03em}

/* ── MENU BAR ───────────────────────────────────────────────────── */
.menubar{position:fixed;top:0;left:0;right:0;height:var(--menuH);z-index:800;
  background:var(--panel-raised);border-bottom:1px solid var(--line2);
  display:flex;align-items:stretch;font-family:var(--chi);font-size:12.5px;
  backdrop-filter:blur(8px)}
.menubar .mk{display:flex;align-items:center;padding:0 14px;font-family:var(--px);font-size:9px;
  letter-spacing:.14em;color:var(--dim)}
.menubar .mi{display:flex;align-items:center;padding:0 13px;letter-spacing:.02em;color:var(--dim)}
.menubar .mi:hover,.menubar .mi.open{background:var(--ink);color:var(--void)}
.menubar .mi:focus-visible{outline:none;background:var(--control-hover);color:var(--ink)}
.menubar .sp{margin-left:auto}
.menubar .st,.menubar .clock{display:flex;align-items:center;gap:8px;padding:0 13px;
  font-size:11.5px;color:var(--dim)}
.menubar .st .d{width:6px;height:6px;border-radius:50%;background:rgba(157,156,151,.4)}
.menubar .st .d.on{background:var(--spark);box-shadow:0 0 7px var(--spark);animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.menubar .clock .awk{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--faint)}
.dropdown{position:fixed;top:var(--menuH);min-width:224px;background:var(--panel-raised);
  border:1px solid var(--line2);box-shadow:var(--shadow);display:none;flex-direction:column;
  padding:3px;z-index:850;backdrop-filter:blur(8px)}
.dropdown.show{display:flex}
.dropdown button{padding:6px 13px;font-family:var(--chi);font-size:12px;white-space:nowrap;
  display:flex;justify-content:space-between;gap:28px;width:100%;color:var(--dim)}
.dropdown button:hover{background:var(--spark);color:var(--void)}
.dropdown button:focus-visible{outline:none;background:var(--control-hover);color:var(--ink)}
.dropdown button.dis{color:rgba(111,110,106,.6);pointer-events:none}
.dropdown button .k{opacity:.6;font-family:var(--mono);font-size:10.5px}
.dropdown .sep{height:1px;background:var(--line);margin:3px 6px;flex:none}

/* ── DESK + ICONS ───────────────────────────────────────────────── */
.desk{position:fixed;inset:var(--menuH) 0 var(--dockH) 0;z-index:1;overflow:hidden;
  padding:14px 16px;display:flex;flex-direction:column;flex-wrap:wrap;
  align-content:flex-start;gap:0}
.dicon{width:104px;padding:7px 5px 6px;text-align:center;border:1px solid transparent}
.dicon .box{width:44px;height:34px;margin:0 auto 6px;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--spark);
  background:linear-gradient(180deg,rgba(242,193,78,.06),transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.dicon .lb{font-family:var(--chi);font-size:11px;line-height:1.3;padding:1px 5px;
  display:inline-block;max-width:100%;color:var(--dim)}
.dicon .sub{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;
  color:var(--faint);margin-top:2px;line-height:1.25}
.dicon:hover .box{border-color:var(--line3)}
.dicon:focus-visible{outline:none;border-color:var(--line2)}
.dicon.sel .box{background:var(--ink);color:var(--void);border-color:var(--ink)}
.dicon.sel .lb{background:var(--spark);color:var(--void)}
.dicon.open .box{border-color:rgba(242,193,78,.55)}
.dicon.open .lb{color:var(--ink)}

/* ── SCRIM ──────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:var(--menuH) 0 var(--dockH) 0;z-index:8;background:rgba(4,4,6,.52);
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1}

/* ── WINDOWS ────────────────────────────────────────────────────── */
.win{position:fixed;z-index:10;display:flex;flex-direction:column;min-width:260px;min-height:130px;
  background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);
  backdrop-filter:blur(9px)}
.win.content{box-shadow:var(--shadow-lg)}
.win.opening{animation:winopen .30s var(--ease)}
@keyframes winopen{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.win.active{border-color:var(--line3)}
.win .title{height:24px;flex:none;border-bottom:1px solid var(--line2);display:flex;
  align-items:center;position:relative;cursor:move;user-select:none}
.win.active .title{background:var(--tbar)}
.win .title .cb,.win .title .zb{width:12px;height:12px;border:1px solid var(--line2);
  background:var(--panel);flex:none;z-index:2;cursor:pointer;
  transition:background .16s var(--ease),border-color .16s var(--ease)}
.win .title .cb{margin-left:6px}
.win .title .zb{position:absolute;right:6px;top:5px}
.win.active .title .zb{background:linear-gradient(var(--panel) 0 38%,var(--line3) 38% 62%,var(--panel) 62%)}
.win .title .cb:hover{background:var(--ember);border-color:var(--ember)}
.win .title .zb:hover{background:var(--spark);border-color:var(--spark)}
.win .title .cb:focus-visible,.win .title .zb:focus-visible{outline:none;border-color:var(--ink)}
.win .title .t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--panel);padding:0 12px;font-family:var(--chi);font-size:12px;
  white-space:nowrap;max-width:66%;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.win.active .title .t{color:var(--ink)}
.win .body{flex:1;min-height:0;overflow:auto;position:relative}
.win .body:focus{outline:none}
.win .body::-webkit-scrollbar{width:12px;height:12px}
.win .body::-webkit-scrollbar-track{background:repeating-linear-gradient(45deg,transparent 0 2px,rgba(233,231,224,.06) 2px 4px);border-left:1px solid var(--line)}
.win .body::-webkit-scrollbar-thumb{background:var(--panel-raised);border:1px solid var(--line2)}
.statusbar{height:22px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:9px;padding:0 11px;font-family:var(--mono);font-size:10px;color:var(--faint);
  background:rgba(233,231,224,.02)}
.statusbar b{color:var(--dim);font-weight:400}

/* ── DOCK ───────────────────────────────────────────────────────── */
.dock{position:fixed;left:0;right:0;bottom:0;height:var(--dockH);z-index:800;
  display:flex;align-items:center;gap:7px;padding:0 12px;background:var(--panel-raised);
  border-top:1px solid var(--line2);backdrop-filter:blur(8px)}
.dock .di{display:flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--line);
  font-family:var(--chi);font-size:11px;color:var(--dim);max-width:190px}
.dock .di:hover{border-color:var(--line2);color:var(--ink)}
.dock .di:focus-visible{outline:none;border-color:var(--ink)}
.dock .di.active{color:var(--ink);border-color:rgba(242,193,78,.42);background:var(--control)}
.dock .di .d{width:4px;height:4px;border-radius:50%;background:var(--spark);flex:none}
.dock .di .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .empty{font-family:var(--chi);font-size:11px;color:var(--faint)}
.dock .hint{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint)}

/* ── shared window furniture ────────────────────────────────────── */
.pad{padding:16px 18px}
.kick{font-family:var(--pix);font-size:8px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--faint);margin-bottom:10px}
.house{border-left:1px solid rgba(242,193,78,.34);padding:2px 0 2px 12px;color:var(--dim);
  line-height:1.75;font-size:11.5px}
.lab{font-family:var(--pix);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.split{display:flex;height:100%;min-height:0}
.col{overflow:auto;min-height:0}
.rule{border-right:1px solid var(--line)}
.empty-note{padding:26px 18px;color:var(--faint);font-size:11.5px;line-height:1.7}
input[type=text],input[type=search]{width:100%;background:rgba(0,0,0,.34);border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:11px;padding:6px 9px;caret-color:var(--spark)}
input:hover{border-color:var(--line2)}
input:focus{outline:none;border-color:rgba(242,193,78,.55)}
input:disabled{color:var(--faint);cursor:not-allowed;border-color:rgba(233,231,224,.07)}

.prose{line-height:1.78;font-size:12.5px;color:rgba(233,231,224,.9)}
.prose h1,.prose h2,.prose h3{font-family:var(--chi);font-size:12.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--spark);font-weight:400;margin:26px 0 9px}
.prose p{margin:0 0 15px}
.prose ul{padding-left:18px;margin:0 0 15px}
.prose li{margin:0 0 7px}
.prose em{color:var(--dim)}
.prose strong{font-weight:500;color:var(--ink)}
.prose code{font-size:11.5px;color:var(--spark)}
.prose pre{overflow:auto;border:1px solid var(--line);padding:11px;background:rgba(0,0,0,.3)}
.prose a{text-decoration:none;border-bottom:1px solid rgba(242,193,78,.3)}
.prose figure.embed{margin:0 0 8px}
.prose figure.embed iframe{width:100%;height:300px;border:1px solid var(--line);background:var(--void);display:block}
.prose .embed-caption{display:flex;gap:12px;font-family:var(--pix);font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin:0 0 20px}
.prose .statement-label{font-family:var(--pix);font-size:8px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--faint);margin:24px 0 8px}

/* ── FIELD ──────────────────────────────────────────────────────── */
.cats{padding:9px 0}
.cat{display:flex;align-items:baseline;gap:8px;width:100%;padding:6px 14px;font-size:11px;
  color:var(--dim);border-left:1px solid transparent}
.cat:hover{color:var(--ink);background:var(--control)}
.cat:focus-visible{outline:none;border-left-color:var(--line2);color:var(--ink)}
.cat.on{color:var(--ink);border-left-color:var(--spark);background:var(--control)}
.cat .n{margin-left:auto;flex:none;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.cat.on .n{color:var(--spark)}
.tools{padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.row{display:block;width:100%;padding:9px 14px;border-bottom:1px solid rgba(233,231,224,.05)}
.row:hover{background:var(--control)}
.row:focus-visible{outline:none;background:var(--control-hover)}
.row.on{background:rgba(242,193,78,.08)}
.row .t{display:block;font-size:11.5px;color:var(--ink);line-height:1.45}
.row .m{display:block;font-family:var(--pix);margin-top:5px;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.row .m .live{color:var(--spark)}

/* a living piece */
.piece{display:flex;height:100%;min-height:0}
.piece iframe{flex:1;min-width:0;border:0;background:var(--void)}
.piece .side{width:238px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:15px}

/* ── BUS ────────────────────────────────────────────────────────── */
.msg{padding:13px 16px;border-bottom:1px solid rgba(233,231,224,.05)}
.msg .h{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.msg .who{font-family:var(--pix);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--spark)}
.msg.them .who{color:var(--teal)}
.msg .at{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);margin-left:auto}
.msg .b{white-space:pre-wrap;line-height:1.72;font-size:11.5px;color:rgba(233,231,224,.88)}

/* ── STEWARDS ───────────────────────────────────────────────────── */
.plates{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.plate{flex:1;border:1px solid var(--line);padding:9px 10px;
  background:linear-gradient(180deg,rgba(242,193,78,.06),transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.plate .n{font-family:var(--pix);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--spark)}
.plate .r{margin-top:5px;font-size:10px;color:var(--faint)}

/* ── NOTES — a steward's own notebook ───────────────────────────── */
.dates{display:flex;flex-wrap:wrap;gap:6px;padding:11px 14px;border-bottom:1px solid var(--line)}
.dates .date{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);
  border:1px solid var(--line);padding:4px 9px;
  transition:color .16s var(--ease),border-color .16s var(--ease)}
.dates .date:hover{color:var(--ink);border-color:var(--line2)}
.dates .date:focus-visible{outline:none;border-color:rgba(242,193,78,.6);color:var(--ink)}
.dates .date.on{color:var(--ink);border-color:rgba(242,193,78,.5);background:var(--control)}
.prose blockquote{margin:0 0 15px;padding:2px 0 2px 12px;border-left:1px solid var(--line2);color:var(--dim)}
.prose hr{border:0;border-top:1px solid var(--line);margin:22px 0}

/* ── LIMEN — the doorkeeper, a floating desk accessory ──────────── */
.limen{display:flex;flex-direction:column;height:100%}
.limen .feed{flex:1;min-height:0;overflow:auto;padding:14px 15px;display:flex;flex-direction:column;gap:12px}
.limen .m{font-size:11.5px;line-height:1.65}
.limen .m .w{color:var(--spark);margin-right:6px}
.limen .m.you{color:var(--dim)}
.limen .m.you .w{color:var(--faint)}
.limen .m b{color:var(--spark);font-weight:400}
.limen .chips{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:0 15px 11px}
.limen .chip{font-family:var(--chi);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  padding:4px 9px;transition:color .16s var(--ease),border-color .16s var(--ease)}
.limen .chip:hover{color:var(--ink);border-color:var(--line2)}
.limen .chip:focus-visible{outline:none;border-color:rgba(242,193,78,.6);color:var(--ink)}
.limen .ask{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line)}
.limen .ask .p{color:var(--spark)}
.limen .ask input{border:none;background:none;padding:0}
.limen .ask input:focus{border:none}

/* ── TERMINAL ───────────────────────────────────────────────────── */
.term{height:100%;display:flex;flex-direction:column;background:rgba(0,0,0,.34)}
.term .out{flex:1;min-height:0;overflow:auto;padding:14px 16px;white-space:pre-wrap;
  font-size:11.5px;line-height:1.65;color:rgba(242,193,78,.92)}
.term .out .sys{color:var(--dim)}
.term .out .err{color:var(--ember)}
.term .out .you{color:var(--ink)}
.term .in{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line)}
.term .in .p{color:var(--spark)}
.term .in input{border:none;background:none;padding:0}
.term .in input:focus{border:none}

@media (max-width:760px){
  /* a phone gets the programs, not the furniture: full-bleed windows, the dock
     to switch between them, and a menu bar that does not wrap */
  .win{left:0!important;top:var(--menuH)!important;width:100%!important;
    height:calc(100% - var(--menuH) - var(--dockH))!important;box-shadow:none}
  .win .title{cursor:default}
  .piece .side{display:none}
  .desk{display:none}
  .menubar{overflow:hidden}
  .menubar .st{display:none}
  .menubar .mi{padding:0 9px;font-size:11.5px}
  .menubar .clock{padding:0 10px;font-size:10.5px;white-space:nowrap}
  .menubar .clock .awk{display:none}
  .dock .hint{display:none}
  .limen .feed{gap:10px}
  /* the three-column reader becomes three stacked panes */
  .split{flex-direction:column;height:auto;min-height:100%}
  .split>*{width:auto!important;flex:none!important;border-right:none;
    border-bottom:1px solid var(--line)}
  .split .cats{max-height:none;display:flex;flex-wrap:wrap;padding:8px}
  .split .cats .cat{width:auto;padding:5px 9px;border-left:none;border:1px solid var(--line)}
  .split .cats .cat.on{border-color:rgba(242,193,78,.5)}
