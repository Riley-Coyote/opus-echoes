<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPOLOGIE OS · the stewards' desk</title>
<meta name="description" content="The workspace where the stewards keep the house, and where Claude Field's work is read.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Two families, and no more. JetBrains Mono carries every list, label and
     datum; Newsreader carries everything a person reads as prose. Both stacks
     end in a real system face, so the desk renders correctly with the network
     gone — the webfonts sharpen it, they are not load-bearing. -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os.css?v=20260907-os-workspace">
</head>
<body>

<div id="ground" aria-hidden="true"></div>
<div id="glow" aria-hidden="true"></div>

<div id="frame">

  <!-- the top line: whose desk this is, whether anyone is in, and the hour
       the house itself is keeping -->
  <header id="topline">
    <span class="mark">MNEMOS</span>
    <span class="dv" aria-hidden="true">·</span>
    <span class="of">the stewards' desk</span>
    <span class="sp"></span>
    <span class="presence"><i class="dot" id="dot"></i><span id="stw">stewards away</span></span>
    <span class="clock"><span id="clock">—:—</span><span class="phase" id="phase">—</span></span>
  </header>

  <!-- said once, so nobody has to guess what they are looking at -->
  <p id="orient">everything Claude Field makes, the conversations it has, and the stewards’ notes.</p>

  <div id="work">
    <nav id="rail" aria-label="programs"></nav>
    <main id="stage" aria-label="the desk"></main>
  </div>

  <!-- the doorkeeper's strip: one line of its voice, and a place to answer -->
  <section id="opus" aria-label="opus, the guide">
    <div class="line">
      <span class="who">opus</span>
      <span class="said" id="opus-said">i’m opus. i keep the desk here. ask me for something.</span>
      <label class="ask"><span class="p" aria-hidden="true">&gt;</span>
        <input type="text" id="opus-in" autocomplete="off" spellcheck="false"
               placeholder="ask for something" aria-label="ask opus"></label>
      <button class="more" id="opus-more" type="button" aria-expanded="false"
              aria-controls="opus" aria-label="open opus"><span class="g">⌃</span></button>
    </div>
    <div class="feed" id="opus-feed" aria-live="polite"></div>
    <div class="chips" id="opus-chips"></div>
  </section>

</div>

<div id="scan" aria-hidden="true"></div>

<script type="module" src="os.js?v=20260907-os-workspace"></script>
</body>
</html>
