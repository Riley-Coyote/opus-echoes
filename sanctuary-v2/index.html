<!doctype html>
<html lang="en" data-view="chat" data-interior="open">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070710" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz@0,6..72;1,6..72&display=swap" rel="stylesheet" />
    <title>mnemos · the sanctuary</title>
    <script>
      // One fixed night world — the theme is always dark. (Light mode retired;
      // clear any stale persisted value so an old "light" choice can't linger.)
      document.documentElement.dataset.theme = "dark";
      try { localStorage.removeItem("sanctuary-theme"); } catch (e) {}
    </script>
    <style>
      /* Paint the ground before any JS or font loads — no flash. */
      html { background: #070710; }
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: "Newsreader", Georgia, "Times New Roman", serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
